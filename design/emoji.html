<!doctype html>
<meta charset="utf-8">
<!-- Emojis proprios do bot (128x128, fundo transparente). Renderizado por
     scripts/gerar_imagens.sh: emoji.html?nome=tocar -> assets/emojis/tocar.png -->
<style>
  html, body { margin: 0; background: transparent; }
  .base { width: 128px; height: 128px; }
</style>
<body>
<svg class="base" viewBox="0 0 128 128" id="alvo"></svg>
<script>
  const fundo = (cor1, cor2) => `
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${cor1}"/><stop offset="1" stop-color="${cor2}"/>
    </linearGradient></defs>
    <circle cx="64" cy="64" r="60" fill="url(#g)"/>`;
  const roxo = fundo("#7B6CFF", "#4E3FD6");
  const vermelho = fundo("#FF6B7A", "#D93A4C");
  const verde = fundo("#4ADE80", "#16A34A");
  const branco = 'fill="#fff"';
  const traco = 'fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"';
  const desenhos = {
    tocar: roxo + `<path d="M52 40 L90 64 L52 88 Z" ${branco} stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`,
    pular: roxo + `<path d="M40 42 L70 64 L40 86 Z" ${branco} stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
                   <rect x="78" y="40" width="10" height="48" rx="4" ${branco}/>`,
    anterior: roxo + `<path d="M88 42 L58 64 L88 86 Z" ${branco} stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
                      <rect x="40" y="40" width="10" height="48" rx="4" ${branco}/>`,
    parar: vermelho + `<rect x="44" y="44" width="40" height="40" rx="8" ${branco}/>`,
    fila: roxo + `<path d="M40 46 H88 M40 64 H88 M40 82 H70" ${traco}/>`,
    atualizar: roxo + `<path d="M86 52 A26 26 0 1 0 90 70" ${traco}/>
                       <path d="M90 34 L90 54 L70 54" ${traco}/>`,
    sorteio: fundo("#FBBF24", "#D97706") + `<rect x="38" y="58" width="52" height="34" rx="5" ${branco}/>
                       <rect x="34" y="46" width="60" height="14" rx="4" ${branco}/>
                       <rect x="60" y="46" width="8" height="46" fill="#D97706"/>
                       <path d="M64 46 C56 30 40 34 48 46 M64 46 C72 30 88 34 80 46" ${traco} stroke-width="6"/>`,
    verificado: verde + `<path d="M42 66 L58 82 L88 48" ${traco} stroke-width="12"/>`,
  };
  const nome = new URLSearchParams(location.search).get("nome") || "tocar";
  document.getElementById("alvo").innerHTML = desenhos[nome];
</script>
