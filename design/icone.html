<!doctype html>
<meta charset="utf-8">
<!-- Icone do projeto (512x512, fundo transparente) -> docs/icone.png -->
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 512px; height: 512px; }
</style>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#4632D9"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B1060" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#fundo)" filter="url(#sombra)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#brilho)"/>
  <!-- arco: tres faixas, como um arco-iris de uma cor so -->
  <g fill="none" stroke-linecap="round">
    <path d="M128 340 A128 128 0 0 1 384 340" stroke="#fff" stroke-width="40"/>
    <path d="M184 340 A72 72 0 0 1 328 340" stroke="#fff" stroke-opacity=".55" stroke-width="32"/>
  </g>
  <!-- brilho de "ativo" -->
  <path d="M372 138 L384 168 L414 180 L384 192 L372 222 L360 192 L330 180 L360 168 Z" fill="#fff"/>
</svg>
